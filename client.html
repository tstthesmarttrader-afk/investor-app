<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investor App</title>
<style>
:root{--bg:#0f1420;--card:#1a2133;--tx:#e8ecf5;--mut:#8b95ad;--ac:#f0b90b;--ok:#2ecc71;--bad:#e74c3c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:480px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #2c3652;background:#10172a;color:var(--tx);font-size:15px}
button{background:var(--ac);color:#000;font-weight:700;border:0;cursor:pointer}
button.sec{background:#2c3652;color:var(--tx)}
.mut{color:var(--mut);font-size:13px}
.big{font-size:18px;font-weight:700;margin-bottom:8px}
.bal{font-size:30px;font-weight:800;color:var(--ac)}
.hide{display:none}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2c3652;font-size:14px}
.pending{color:var(--ac)}.approved,.profit,.deposit{color:var(--ok)}.rejected,.loss,.withdrawal{color:var(--bad)}
#prev{max-width:100%;border-radius:10px;margin-top:6px}
.copy{word-break:break-all;background:#10172a;padding:8px;border-radius:8px;margin-top:4px}
.stats{display:flex;gap:12px;margin-top:6px}
.stat{flex:1;background:#10172a;border-radius:12px;padding:12px}
.stat b{display:block;font-size:17px;margin-top:4px}
.earn{font-size:26px;font-weight:800}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--tx)}
.idbox{background:#10172a;border:1px dashed var(--ac);border-radius:12px;padding:14px;text-align:center;margin:8px 0}
.idbox span{display:block;font-size:30px;font-weight:800;color:var(--ac);letter-spacing:1px}
.ann{background:#2a2410;border:1px solid var(--ac);border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
.disc{font-size:12px;color:var(--mut);text-align:center;margin:10px 0 24px}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div class="wrap">
  <h2>💼 Investor App</h2>

  <div id="auth" class="card">
    <div id="loginBox">
      <b>Login</b>
      <input id="lid" placeholder="Login ID (e.g. C123456)" autocapitalize="characters">
      <input id="lpw" type="password" placeholder="Password">
      <button id="btnLogin">Login</button>
      <button class="sec" id="toReg">Create new account</button>
    </div>
    <div id="regBox" class="hide">
      <b>Register</b>
      <input id="rname" placeholder="Full name">
      <input id="rpw" type="password" placeholder="Password (at least 6 characters)">
      <input id="rpw2" type="password" placeholder="Confirm password">
      <button id="btnReg">Register</button>
      <button class="sec" id="toLogin">Back to Login</button>
    </div>
    <div id="doneBox" class="hide">
      <b>Registration successful!</b>
      <div class="mut" style="margin-top:6px">Your Login ID is:</div>
      <div class="idbox"><span id="newId"></span></div>
      <div class="mut">Save this ID. You need it with your password to log in.</div>
      <button id="toLogin2">Go to Login</button>
    </div>
    <div id="amsg" class="mut"></div>
